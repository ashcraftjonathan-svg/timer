<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preaching Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #countdown-app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220px;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #display-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.18em;
      pointer-events: none;
    }

    #timer {
      line-height: 1;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      color: #00cc44;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    #current-time {
      line-height: 1;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .tap-zone {
      position: absolute;
      z-index: 5;
    }

    #zone-top {
      top: 0;
      left: 0;
      width: 100%;
      height: 25%;
    }

    #zone-bottom {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 25%;
    }

    #zone-left {
      top: 25%;
      left: 0;
      width: 25%;
      height: 50%;
    }

    #zone-center {
      top: 25%;
      left: 25%;
      width: 50%;
      height: 50%;
    }

    .flash {
      animation: flash-red 1s steps(1, end) infinite;
    }

    @keyframes flash-red {
      0%   { color: #ff2b2b; }
      50%  { color: #000000; }
      100% { color: #ff2b2b; }
    }
  </style>
</head>

<body>
  <div id="countdown-app">
    <div id="display-wrap">
      <div id="timer">35:00</div>
      <div id="current-time">12:00</div>
    </div>

    <div id="zone-top" class="tap-zone"></div>
    <div id="zone-bottom" class="tap-zone"></div>
    <div id="zone-left" class="tap-zone"></div>
    <div id="zone-center" class="tap-zone"></div>
  </div>

  <script>
    (function () {
      const START_SECONDS = 35 * 60;
      let time = START_SECONDS;
      let paused = false;

      const app = document.getElementById('countdown-app');
      const timerEl = document.getElementById('timer');
      const currentTimeEl = document.getElementById('current-time');

      function pad(num) {
        return String(num).padStart(2, '0');
      }

      function getTimerParts(t) {
        const abs = Math.abs(t);
        return {
          mins: Math.floor(abs / 60),
          secs: abs % 60
        };
      }

      function getCurrentTimeText() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();

        hours = hours % 12;
        if (hours === 0) hours = 12;

        return `${hours}:${pad(minutes)}`;
      }

      function updateColorAndFlash() {
        timerEl.classList.remove('flash');

        if (time > 10 * 60) {
          timerEl.style.color = '#00cc44';
        } else if (time > 5 * 60) {
          timerEl.style.color = '#ffcc00';
        } else if (time > 0) {
          timerEl.style.color = '#ff2b2b';
        } else {
          timerEl.style.color = '#ff2b2b';
          timerEl.classList.add('flash');
        }
      }

      function renderTimer() {
        const parts = getTimerParts(time);
        timerEl.textContent = `${pad(parts.mins)}:${pad(parts.secs)}`;
        updateColorAndFlash();
        fitText();
      }

      function renderCurrentTime() {
        currentTimeEl.textContent = getCurrentTimeText();
      }

      function fitText() {
        const rect = app.getBoundingClientRect();
        const maxW = rect.width * 0.9;
        const maxTimerH = rect.height * 0.42;
        const maxClockH = rect.height * 0.18;

        if (rect.width <= 0 || rect.height <= 0) return;

        let low = 10;
        let high = Math.max(40, Math.floor(rect.height * 2));
        let best = low;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          timerEl.style.fontSize = mid + 'px';
          currentTimeEl.style.fontSize = Math.floor(mid / 2) + 'px';

          const totalHeight = timerEl.scrollHeight + currentTimeEl.scrollHeight;
          const totalWidth = Math.max(timerEl.scrollWidth, currentTimeEl.scrollWidth);
          const timerFitsHeight = timerEl.scrollHeight <= maxTimerH;
          const clockFitsHeight = currentTimeEl.scrollHeight <= maxClockH;
          const fitsWidth = totalWidth <= maxW;
          const fitsTotalHeight = totalHeight <= rect.height * 0.72;

          if (fitsWidth && fitsTotalHeight && timerFitsHeight && clockFitsHeight) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        timerEl.style.fontSize = best + 'px';
        currentTimeEl.style.fontSize = Math.floor(best / 2) + 'px';
      }

      function tickCountdown() {
        if (!paused) {
          time -= 1;
          renderTimer();
        }
      }

      function tickCurrentTime() {
        renderCurrentTime();
        fitText();
      }

      function addMinute() {
        time += 60;
        renderTimer();
      }

      function subtractMinute() {
        time -= 60;
        renderTimer();
      }

      function resetTimer() {
        time = START_SECONDS;
        paused = false;
        renderTimer();
      }

      function togglePause() {
        paused = !paused;
      }

      function bind(el, fn) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          fn();
        });

        el.addEventListener('touchstart', function (e) {
          e.preventDefault();
          fn();
        }, { passive: false });
      }

      bind(document.getElementById('zone-top'), addMinute);
      bind(document.getElementById('zone-bottom'), subtractMinute);
      bind(document.getElementById('zone-left'), resetTimer);
      bind(document.getElementById('zone-center'), togglePause);

      new ResizeObserver(fitText).observe(app);
      window.addEventListener('resize', fitText);

      renderCurrentTime();
      renderTimer();

      setInterval(tickCountdown, 1000);

      const now = new Date();
      const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

      setTimeout(function () {
        tickCurrentTime();
        setInterval(tickCurrentTime, 60000);
      }, msUntilNextMinute);
    })();
  </script>
</body>
</html>
