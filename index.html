<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #countdown-app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220px;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #timer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      color: #00cc44;

      /* Prevent sideways shifting */
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .tap-zone {
      position: absolute;
      z-index: 5;
    }

    #zone-top {
      top: 0;
      left: 0;
      width: 100%;
      height: 25%;
    }

    #zone-bottom {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 25%;
    }

    #zone-left {
      top: 25%;
      left: 0;
      width: 25%;
      height: 50%;
    }

    #zone-center {
      top: 25%;
      left: 25%;
      width: 50%;
      height: 50%;
    }
  </style>
</head>

<body>
  <div id="countdown-app">
    <div id="timer">35:00</div>

    <div id="zone-top" class="tap-zone"></div>
    <div id="zone-bottom" class="tap-zone"></div>
    <div id="zone-left" class="tap-zone"></div>
    <div id="zone-center" class="tap-zone"></div>
  </div>

  <script>
    (function () {
      const START_SECONDS = 35 * 60;
      let time = START_SECONDS;
      let paused = false;

      const app = document.getElementById('countdown-app');
      const timerEl = document.getElementById('timer');

      function pad(num) {
        return String(num).padStart(2, '0');
      }

      function getParts(t) {
        const abs = Math.abs(t);
        return {
          mins: Math.floor(abs / 60),
          secs: abs % 60
        };
      }

      function updateColor() {
        if (time > 10 * 60) {
          timerEl.style.color = '#00cc44';
        } else if (time > 5 * 60) {
          timerEl.style.color = '#ffcc00';
        } else {
          timerEl.style.color = '#ff2b2b';
        }
      }

      function render() {
        const { mins, secs } = getParts(time);
        timerEl.textContent = `${pad(mins)}:${pad(secs)}`;
        updateColor();
        fitText();
      }

      function fitText() {
        const rect = app.getBoundingClientRect();
        const maxW = rect.width * 0.9;
        const maxH = rect.height * 0.7;

        let low = 10;
        let high = Math.max(40, rect.height * 2);
        let best = low;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          timerEl.style.fontSize = mid + 'px';

          if (
            timerEl.scrollWidth <= maxW &&
            timerEl.scrollHeight <= maxH
          ) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        timerEl.style.fontSize = best + 'px';
      }

      function tick() {
        if (!paused) {
          time -= 1;
          render();
        }
      }

      function addMinute() {
        time += 60;
        render();
      }

      function subtractMinute() {
        time -= 60;
        render();
      }

      function resetTimer() {
        time = START_SECONDS;
        paused = false;
        render();
      }

      function togglePause() {
        paused = !paused;
      }

      function bind(el, fn) {
        el.addEventListener('click', e => {
          e.preventDefault();
          fn();
        });

        el.addEventListener('touchstart', e => {
          e.preventDefault();
          fn();
        }, { passive: false });
      }

      bind(document.getElementById('zone-top'), addMinute);
      bind(document.getElementById('zone-bottom'), subtractMinute);
      bind(document.getElementById('zone-left'), resetTimer);
      bind(document.getElementById('zone-center'), togglePause);

      new ResizeObserver(fitText).observe(app);
      window.addEventListener('resize', fitText);

      render();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
